name: kim_mobprog
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Klavika
      fonts:
        - asset: assets/fonts/Klavika-Bold.ttf
    - family: Frutiger
      fonts:
        - asset: assets/fonts/FrutigerLTStd-Roman.ttf
  uses-material-design: true
